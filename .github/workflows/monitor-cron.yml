name: Monitor cron

# Runs the due website checks every 15 minutes by calling the app's
# secret-gated cron endpoint. Requires repo secrets APP_URL and CRON_SECRET.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due monitors
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set; skipping."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 90 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/cron/run-monitors"
