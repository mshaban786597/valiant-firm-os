name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders so `next build` / `prisma generate` never crash
      # in CI. No real database is contacted — pages are server-rendered on
      # demand and unit tests mock Prisma. Real secrets live only in Vercel.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
